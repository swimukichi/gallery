name: note stats

# 毎日 23:30（JST）に note のスキ・コメントを集めて content/stats/note-posts.csv を更新する
# 公開リポジトリなので GitHub Actions の実行は無料
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect note stats
        run: node scripts/note-stats.js
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/stats/note-posts.csv
          git diff --staged --quiet && exit 0
          git commit -m "auto: note stats $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 5
          done
          exit 1
